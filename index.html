<script>
// ── Music ──
const bgm = document.getElementById('bgm');
const musicBtn = document.getElementById('music-btn');
let musicPlaying = false;

// Try autoplay on first interaction
document.addEventListener('click', function startMusic(){
  if(!musicPlaying){
    bgm.volume = 0.35;
    bgm.play().then(()=>{
      musicPlaying = true;
      musicBtn.textContent = '♫';
      musicBtn.classList.add('playing');
    }).catch(()=>{});
  }
  document.removeEventListener('click', startMusic);
}, {once: true});

musicBtn.addEventListener('click', (e)=>{
  e.stopPropagation();
  if(musicPlaying){
    bgm.pause();
    musicPlaying = false;
    musicBtn.textContent = '♪';
    musicBtn.classList.remove('playing');
  } else {
    bgm.play().then(()=>{
      musicPlaying = true;
      musicBtn.textContent = '♫';
      musicBtn.classList.add('playing');
    });
  }
});

// ── Gold particle trail (DOM-based) ──
(function(){
  var COLORS=['#ffd700','#ffed80','#ffc840','#fff0a0','#ffda44'];
  window.addEventListener('mousemove',function(e){
    for(var i=0;i<5;i++){
      var d=document.createElement('div');
      var size=4+Math.random()*8;
      var isStar=Math.random()>0.6;
      d.style.position='fixed';
      d.style.pointerEvents='none';
      d.style.zIndex='99999';
      d.style.left=(e.clientX+(Math.random()-.5)*16)+'px';
      d.style.top=(e.clientY+(Math.random()-.5)*16)+'px';
      d.style.width=size+'px';
      d.style.height=size+'px';
      d.style.borderRadius=isStar?'2px':'50%';
      d.style.background=COLORS[Math.floor(Math.random()*COLORS.length)];
      d.style.transform='translate(-50%,-50%)';
      d.style.opacity='1';
      document.body.appendChild(d);
      var vx=(Math.random()-.5)*80;
      var vy=(Math.random()-.5)*80-40;
      var start=null;
      (function(el,dvx,dvy){
        function step(ts){
          if(!start)start=ts;
          var p=(ts-start)/700;
          if(p>=1){el.remove();return;}
          el.style.transform='translate(calc(-50% + '+dvx*p+'px),calc(-50% + '+(dvy*p+50*p*p)+'px)) rotate('+(p*180)+'deg)';
          el.style.opacity=''+(1-p);
          requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
      })(d,vx,vy);
    }
  },true);
})();


</script>

// ── Fetch and draw countries ──
function fetchCountries(){
  fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')
    .then(r=>r.json())
    .then(world=>{
      // topojson decode inline (minimal)
      const topo=world;
      drawCountriesOnCanvas(topo);
      fill.style.width='95%';
      buildCityDots();
      setTimeout(()=>{
        fill.style.width='100%';
        setTimeout(()=>document.getElementById('loading').classList.add('done'),600);
      },400);
    })
    .catch(()=>{
      buildCityDots();
      document.getElementById('loading').classList.add('done');
    });
}

// Minimal topojson arc decoder
function decodeArcs(topo){
  const arcs=topo.arcs;
  return arcs.map(arc=>{
    let x=0,y=0;
    return arc.map(pt=>{x+=pt[0];y+=pt[1];return[x,y];});
  });
}

function topoFeature(topo,obj){
  const decodedArcs=decodeArcs(topo);
  const scale=topo.transform?topo.transform.scale:[1,1];
  const translate=topo.transform?topo.transform.translate:[0,0];
  function scalePoint(pt){return[pt[0]*scale[0]+translate[0],pt[1]*scale[1]+translate[1]];}
  function arcPoints(idx){
    const reversed=idx<0;
    const arc=decodedArcs[reversed?~idx:idx];
    const pts=arc.map(scalePoint);
    return reversed?pts.slice().reverse():pts;
  }
  function ringCoords(ring){
    let pts=[];
    ring.forEach(idx=>{const ap=arcPoints(idx);pts=pts.concat(idx<0?ap.slice(0,-1):ap.slice(0,-1));});
    return pts;
  }
  return obj.geometries.map(geom=>{
    const id=String(geom.id).padStart(3,'0');
    let polygons=[];
    if(geom.type==='Polygon'){polygons=[geom.arcs.map(ringCoords)];}
    else if(geom.type==='MultiPolygon'){polygons=geom.arcs.map(p=>p.map(ringCoords));}
    return{id,polygons};
  });
}

function drawCountriesOnCanvas(topo){
  const W2=overlayCanvas.width,H2=overlayCanvas.height;
  octx.clearRect(0,0,W2,H2);
  const features=topoFeature(topo,topo.objects.countries);
  features.forEach(f=>{
    const visited=VISITED.has(f.id);
    f.polygons.forEach(poly=>{
      poly.forEach((ring,ri)=>{
        octx.beginPath();
        ring.forEach((pt,i)=>{
          // pt is [lng,lat] in degrees
          const lng=pt[0],lat=pt[1];
          const px=(lng+180)/360*W2;
          const py=(90-lat)/180*H2;
          if(i===0)octx.moveTo(px,py);else octx.lineTo(px,py);
        });
        octx.closePath();
        if(ri===0){
          if(visited){
            octx.fillStyle='rgba(212,155,40,0.55)';
            octx.fill();
            octx.strokeStyle='rgba(255,200,80,0.35)';
            octx.lineWidth=1.2;
            octx.stroke();
          } else {
            octx.strokeStyle='rgba(30,45,70,0.4)';
            octx.lineWidth=0.6;
            octx.stroke();
          }
        }
      });
    });
  });
  overlayTex.needsUpdate=true;
}

// ── City dots ──
const dotGroup=new THREE.Group();
globeGroup.add(dotGroup);
const cityMeshes=[];

function buildCityDots(){
  CITIES_BASE.forEach(city=>{
    const pos=latLngTo3D(city.coords[0],city.coords[1],GR*1.012);
    // Pulse ring
    const ring=new THREE.Mesh(
      new THREE.SphereGeometry(0.011,10,10),
      new THREE.MeshBasicMaterial({color:0xffd060,transparent:true,opacity:0.3})
    );
    ring.position.copy(pos);
    ring._phase=Math.random()*Math.PI*2;
    ring._isRing=true;
    dotGroup.add(ring);
    // Core
    const dot=new THREE.Mesh(
      new THREE.SphereGeometry(0.007,10,10),
      new THREE.MeshBasicMaterial({color:0xffe090})
    );
    dot.position.copy(pos);
    dot._city=city;
    cityMeshes.push(dot);
    dotGroup.add(dot);
    // Tiny white center
    const ctr=new THREE.Mesh(
      new THREE.SphereGeometry(0.003,8,8),
      new THREE.MeshBasicMaterial({color:0xfffdf0})
    );
    ctr.position.copy(pos);
    dotGroup.add(ctr);
  });
}

function latLngTo3D(lat,lng,r){
  const phi=(90-lat)*Math.PI/180;
  const theta=(lng+180)*Math.PI/180;
  return new THREE.Vector3(-r*Math.sin(phi)*Math.cos(theta),r*Math.cos(phi),r*Math.sin(phi)*Math.sin(theta));
}

// ── Interaction ──
const raycaster=new THREE.Raycaster();
const mouse2=new THREE.Vector2();
let isDrag=false,prevM={x:0,y:0},rotV={x:0,y:0},isTouching=false;
let hovCity=null,panelOpen=false;
const tooltip=document.getElementById('tooltip');

function getCity(mx,my){
  mouse2.x=(mx/window.innerWidth)*2-1;
  mouse2.y=-(my/window.innerHeight)*2+1;
  raycaster.setFromCamera(mouse2,camera);
  const hits=raycaster.intersectObjects(cityMeshes);
  return hits.length?hits[0].object._city:null;
}

function isUITarget(e){
  // Any click inside panel, modal, fab, dim, or loading should NOT trigger globe drag
  return !!(e.target.closest('#fab-hit,#fab,#add-modal,#panel,#dim,#loading,#zoom-btns,#photo-prev,#photo-next'));
}

function modalOpen(){
  return document.getElementById('add-modal').classList.contains('show');
}

document.addEventListener('mousedown',e=>{
  if(isUITarget(e))return;
  if(panelOpen)return;
  if(modalOpen())return;
  isDrag=true;prevM={x:e.clientX,y:e.clientY};rotV={x:0,y:0};
  document.body.style.cursor='grabbing';
});

document.addEventListener('mousemove',e=>{
  if(isDrag){
    const dx=e.clientX-prevM.x,dy=e.clientY-prevM.y;
    rotV.y=dx*0.005;rotV.x=dy*0.005;
    globeGroup.rotation.y+=rotV.y;globeGroup.rotation.x+=rotV.x;
    prevM={x:e.clientX,y:e.clientY};
  } else {
    if(panelOpen||modalOpen())return;
    const c=getCity(e.clientX,e.clientY);
    if(c!==hovCity){
      hovCity=c;
      if(c){
        document.getElementById('tt-name').textContent=c.name;
        document.getElementById('tt-country').textContent=c.country;
        document.getElementById('tt-desc').textContent=c.desc;
        tooltip.classList.add('show');
        document.body.style.cursor='pointer';
      } else {
        tooltip.classList.remove('show');
        document.body.style.cursor='grab';
      }
    }
    if(c){tooltip.style.left=(e.clientX+16)+'px';tooltip.style.top=(e.clientY-10)+'px';}
  }
});

document.addEventListener('mouseup',e=>{
  if(isUITarget(e)||modalOpen()){isDrag=false;document.body.style.cursor='grab';return;}
  if(!isDrag)return;
  isDrag=false;
  document.body.style.cursor='grab';
  const c=getCity(e.clientX,e.clientY);
  if(c)openPanel(c);
});

document.addEventListener('mouseleave',()=>{isDrag=false;});

// ── Touch support ──
document.addEventListener('touchstart',e=>{
  if(isUITarget(e))return;
  if(panelOpen||modalOpen())return;
  const t=e.touches[0];
  isDrag=true;isTouching=true;prevM={x:t.clientX,y:t.clientY};rotV={x:0,y:0};
},{passive:true});

document.addEventListener('touchmove',e=>{
  if(!isDrag)return;
  const t=e.touches[0];
  const dx=t.clientX-prevM.x,dy=t.clientY-prevM.y;
  rotV.y=dx*0.005;rotV.x=dy*0.005;
  globeGroup.rotation.y+=rotV.y;globeGroup.rotation.x+=rotV.x;
  prevM={x:t.clientX,y:t.clientY};
},{passive:true});

document.addEventListener('touchend',e=>{
  isTouching=false;
  if(!isDrag)return;
  isDrag=false;
  const t=e.changedTouches[0];
  // Check if it was a tap (not a drag)
  if(e.changedTouches.length===1){
    const dx=Math.abs(t.clientX-prevM.x),dy=Math.abs(t.clientY-prevM.y);
    if(dx<8&&dy<8){
      const c=getCity(t.clientX,t.clientY);
      if(c)openPanel(c);
    }
  }
});

// Pinch to zoom
let lastPinchDist=0;
document.addEventListener('touchmove',e=>{
  if(e.touches.length===2){
    const dx=e.touches[0].clientX-e.touches[1].clientX;
    const dy=e.touches[0].clientY-e.touches[1].clientY;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(lastPinchDist>0){
      camera.position.z=Math.max(1.5,Math.min(5,camera.position.z-(dist-lastPinchDist)*0.01));
    }
    lastPinchDist=dist;
  } else {
    lastPinchDist=0;
  }
},{passive:true});

document.addEventListener('wheel',e=>{
  if(isUITarget(e))return;
  camera.position.z=Math.max(1.5,Math.min(5,camera.position.z+e.deltaY*0.003));
},{passive:true});

document.body.style.cursor='grab';

// ── Animate ──
let t2=0;
function animate(){
  requestAnimationFrame(animate);t2+=0.016;
  if(!isDrag&&!panelOpen&&!isTouching){globeGroup.rotation.y+=0.0006;}
  if(!isDrag){
    rotV.x*=0.9;rotV.y*=0.9;
    if(Math.abs(rotV.x)>0.00005){globeGroup.rotation.x+=rotV.x;}
    if(Math.abs(rotV.y)>0.00005){globeGroup.rotation.y+=rotV.y;}
  }
  dotGroup.children.forEach(m=>{
    if(m._isRing){
      const s=1+0.7*Math.abs(Math.sin(t2*1.4+m._phase));
      m.scale.setScalar(s);
      m.material.opacity=0.4*(1-Math.abs(Math.sin(t2*1.4+m._phase))*0.7);
    }
  });
  renderer.render(scene,camera);
}
animate();

}

function setEditMode(){
  const d=getCityData(curCity.id);
  editMode=true;tmpPhotos=[...(d.photos||[])];
  document.getElementById('panel-note-view').style.display='none';
  const ta=document.getElementById('panel-note-edit');
  ta.style.display='block';ta.value=d.note||'';
  document.getElementById('date-input').value=d.date||'';
  document.getElementById('date-row').classList.add('visible');
  document.getElementById('upload-btn-row').classList.add('visible');
  document.getElementById('btn-edit').style.display='none';
  document.getElementById('btn-save').style.display='block';
  document.getElementById('btn-cancel').style.display='block';
  renderPhotoList();
}

function renderPhotos(photos){
  const img=document.getElementById('panel-img');
  const empty=document.getElementById('photo-empty');
  const dots=document.getElementById('photo-dots');
  const prev=document.getElementById('photo-prev');
  const next=document.getElementById('photo-next');
  if(photos&&photos.length>0){
    img.style.display='block';img.classList.remove('loaded');
    img.onload=()=>img.classList.add('loaded');img.src=photos[photIdx]||'';
    empty.style.display='none';
    dots.innerHTML=photos.map((_,i)=>`<div class="pdot ${i===photIdx?'on':''}" style="width:${i===photIdx?'18':'5'}px" onclick="setPhoto(${i})"></div>`).join('');
    prev.style.display=photos.length>1?'flex':'none';
    next.style.display=photos.length>1?'flex':'none';
  } else {
    img.style.display='none';empty.style.display='flex';dots.innerHTML='';
    prev.style.display='none';next.style.display='none';
  }
}

function renderPhotoList(){
  const pl=document.getElementById('photo-list');pl.classList.add('visible');
  pl.innerHTML=tmpPhotos.map((url,i)=>`<div class="photo-item"><span class="photo-item-url">${url}</span><button class="photo-item-del" onclick="removePhoto(${i})">✕</button></div>`).join('');
  renderPhotos(tmpPhotos);
}

function setPhoto(i){photIdx=i;const d=getCityData(curCity.id);renderPhotos(editMode?tmpPhotos:d.photos||[]);}

document.getElementById('photo-prev').addEventListener('mousedown',e=>e.stopPropagation());
document.getElementById('photo-prev').addEventListener('mouseup',e=>e.stopPropagation());
document.getElementById('photo-prev').addEventListener('click',e=>{
  e.stopPropagation();
  const photos=editMode?tmpPhotos:(curCity?getCityData(curCity.id).photos||[]:[]);
  if(photos.length<2)return;
  photIdx=(photIdx-1+photos.length)%photos.length;
  renderPhotos(photos);
});
document.getElementById('photo-next').addEventListener('mousedown',e=>e.stopPropagation());
document.getElementById('photo-next').addEventListener('mouseup',e=>e.stopPropagation());
document.getElementById('photo-next').addEventListener('click',e=>{
  e.stopPropagation();
  const photos=editMode?tmpPhotos:(curCity?getCityData(curCity.id).photos||[]:[]);
  if(photos.length<2)return;
  photIdx=(photIdx+1)%photos.length;
  renderPhotos(photos);
});
function removePhoto(i){tmpPhotos.splice(i,1);renderPhotoList();}

document.getElementById('upload-btn').addEventListener('click',()=>{
  document.getElementById('file-input').click();
});
document.getElementById('file-input').addEventListener('change',function(){
  const files=Array.from(this.files);
  if(!files.length)return;
  files.forEach(file=>{
    const reader=new FileReader();
    reader.onload=e=>{
      tmpPhotos.push(e.target.result);
      renderPhotoList();
    };
    reader.readAsDataURL(file);
  });
  this.value='';
});
document.getElementById('btn-edit').addEventListener('click',setEditMode);
document.getElementById('btn-save').addEventListener('click',()=>{
  const note=document.getElementById('panel-note-edit').value.trim();
  const date=document.getElementById('date-input').value.trim();
  setCityData(curCity.id,{note,photos:tmpPhotos,date});
  const nv=document.getElementById('panel-note-view');
  if(note){nv.textContent=note;nv.classList.remove('empty');}
  else{nv.textContent='这座城市的故事还等待着被记录…';nv.classList.add('empty');}
  document.getElementById('panel-meta').textContent=(date?date+' · ':'')+curCity.country;
  renderPhotos(tmpPhotos);setViewMode();
});
document.getElementById('btn-cancel').addEventListener('click',()=>{
  const d=getCityData(curCity.id);renderPhotos(d.photos||[]);setViewMode();
});

function closePanel(){
  document.getElementById('panel').classList.remove('open');
  document.getElementById('dim').classList.remove('show');
  panelOpen=false;curCity=null;
}
document.getElementById('close-panel').addEventListener('click',closePanel);
document.getElementById('dim').addEventListener('click',closePanel);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closePanel();document.getElementById('add-modal').classList.remove('show');}
  if((e.key==='a'||e.key==='A')&&!e.target.matches('input,textarea')){
    document.getElementById('add-name').value='';
    document.getElementById('add-country').value='';
    document.getElementById('add-desc').value='';
    document.getElementById('add-lat').value='';
    document.getElementById('add-lng').value='';
    document.getElementById('add-status').textContent='';
    document.getElementById('add-modal').classList.add('show');
  }
});

// ── Add City ──
let userCities = [];
try { userCities = JSON.parse(localStorage.getItem('userCities') || '[]'); } catch(e){}

function saveUserCities(){ localStorage.setItem('userCities', JSON.stringify(userCities)); }

function addDotToGlobe(city){
  const pos = latLngTo3D(city.coords[0], city.coords[1], GR*1.012);
  const ring = new THREE.Mesh(
    new THREE.SphereGeometry(0.011,10,10),
    new THREE.MeshBasicMaterial({color:0xffd060,transparent:true,opacity:0.3})
  );
  ring.position.copy(pos);
  ring._phase = Math.random()*Math.PI*2;
  ring._isRing = true;
  dotGroup.add(ring);
  const dot = new THREE.Mesh(
    new THREE.SphereGeometry(0.007,10,10),
    new THREE.MeshBasicMaterial({color:0xffe090})
  );
  dot.position.copy(pos);
  dot._city = city;
  cityMeshes.push(dot);
  dotGroup.add(dot);
  const ctr = new THREE.Mesh(
    new THREE.SphereGeometry(0.003,8,8),
    new THREE.MeshBasicMaterial({color:0xfffdf0})
  );
  ctr.position.copy(pos);
  dotGroup.add(ctr);
}

// ── Stats update ──
function updateStats(){
  const totalCities = CITIES_BASE.length + userCities.length;
  const userCountries = new Set(userCities.map(c=>c.country));
  const baseCountries = new Set(CITIES_BASE.map(c=>c.country));
  const allCountries = new Set([...baseCountries, ...userCountries]);
  const totalCountries = allCountries.size;
  // Continents: rough mapping
  const continentMap = {
    '英国':1,'西班牙':1,'法国':1,'摩纳哥':1,'意大利':1,'德国':1,'冰岛':1,
    '捷克':1,'奥地利':1,'匈牙利':1,'葡萄牙':1,'丹麦':1,'荷兰':1,'土耳其':1,
    '突尼斯':2,'摩洛哥':2,
    '中国':3,'香港':3,'韩国':3,'日本':3,
    '美国':4,
  };
  const continents = new Set();
  allCountries.forEach(c => { if(continentMap[c]) continents.add(continentMap[c]); });
  const totalContinents = Math.max(4, continents.size);
  document.querySelectorAll('.sn')[0].textContent = totalCities;
  document.querySelectorAll('.sn')[1].textContent = totalCountries;
  document.querySelectorAll('.sn')[2].textContent = totalContinents;
}

// ISO lookup: first try local cache, then fetch from nominatim
const isoCache = {};
CITIES_BASE.forEach(c=>{ if(c.iso) isoCache[c.country]=c.iso; });

async function getIsoByCountryName(countryName){
  if(isoCache[countryName]) return isoCache[countryName];
  try {
    const q = encodeURIComponent(countryName);
    const res = await fetch('https://nominatim.openstreetmap.org/search?q='+q+'&format=json&limit=1&featuretype=country');
    const data = await res.json();
    if(data && data.length > 0 && data[0].osm_type){
      // Get country details via reverse lookup
      const lat = data[0].lat, lon = data[0].lon;
      const rev = await fetch('https://nominatim.openstreetmap.org/reverse?lat='+lat+'&lon='+lon+'&format=json');
      const rd = await rev.json();
      const cc = rd.address && rd.address.country_code;
      if(cc){
        // Convert alpha-2 to numeric ISO via a small lookup
        const alpha2ToNum = {
          'th':'764','pl':'616','my':'458','sg':'702','vn':'704','id':'360',
          'ph':'608','in':'356','ae':'784','eg':'818','za':'710','br':'076',
          'ar':'032','mx':'484','ca':'124','au':'036','nz':'554','ng':'566',
          'ke':'404','gh':'288','et':'231','tz':'834','ma':'504','dz':'012',
          'tn':'788','ly':'434','sd':'729','so':'706','mz':'508','zm':'894',
          'zw':'716','bw':'072','na':'516','sz':'748','ls':'426','mg':'450',
          'no':'578','se':'752','fi':'246','ee':'233','lv':'428','lt':'440',
          'by':'112','ua':'804','md':'498','ro':'642','bg':'100','rs':'688',
          'hr':'191','ba':'070','si':'705','sk':'703','mk':'807','al':'008',
          'gr':'300','cy':'196','mt':'470','lu':'442','be':'056','nl':'528',
          'ch':'756','at':'040','de':'276','fr':'250','es':'724','pt':'620',
          'gb':'826','ie':'372','is':'352','dk':'208','pl':'616','cz':'203',
          'hu':'348','tr':'792','il':'376','jo':'400','lb':'422','sy':'760',
          'iq':'368','ir':'364','sa':'682','ye':'887','om':'512','kw':'414',
          'bh':'048','qa':'634','uz':'860','kz':'398','mn':'496','kr':'410',
          'jp':'392','cn':'156','tw':'158','hk':'344','mo':'446','vn':'704',
          'th':'764','la':'418','kh':'116','mm':'104','bd':'050','np':'524',
          'lk':'144','pk':'586','af':'004','us':'840','mx':'484','cu':'192',
          'do':'214','ht':'332','jm':'388','tt':'780','co':'170','ve':'862',
          'ec':'218','pe':'604','bo':'068','py':'600','uy':'858','cl':'152',
        };
        const numeric = alpha2ToNum[cc.toLowerCase()];
        if(numeric){ isoCache[countryName]=numeric; return numeric; }
      }
    }
  } catch(e){}
  return null;
}

// Load saved user cities on startup - restore their country highlights
(async function(){
  for(const c of userCities){
    addDotToGlobe(c);
    const iso = await getIsoByCountryName(c.country);
    if(iso) VISITED.add(iso);
  }
  updateStats();
  // Repaint after all ISOs resolved
  if(userCities.length > 0){
    fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')
      .then(r=>r.json()).then(w=>drawCountriesOnCanvas(w)).catch(()=>{});
  }
})();

// FAB open modal
document.getElementById('fab-hit').addEventListener('click', (e)=>{
  e.stopPropagation();
  e.preventDefault();
  document.getElementById('add-name').value='';
  document.getElementById('add-country').value='';
  document.getElementById('add-desc').value='';
  document.getElementById('add-lat').value='';
  document.getElementById('add-lng').value='';
  document.getElementById('add-status').textContent='';
  document.getElementById('add-modal').classList.add('show');
});


// Auto-lookup coords via nominatim
document.getElementById('add-search-btn').addEventListener('click', async ()=>{
  const name = document.getElementById('add-name').value.trim();
  const country = document.getElementById('add-country').value.trim();
  if(!name){ document.getElementById('add-status').textContent='请先填写城市名称'; return; }
  document.getElementById('add-status').textContent='查询中…';
  document.getElementById('add-status').style.color='#7a8090';
  try {
    const q = encodeURIComponent(name + (country ? ', '+country : ''));
    const res = await fetch(`https://nominatim.openstreetmap.org/search?q=${q}&format=json&limit=1`);
    const data = await res.json();
    if(data && data.length > 0){
      const lat = parseFloat(data[0].lat).toFixed(4);
      const lng = parseFloat(data[0].lon).toFixed(4);
      document.getElementById('add-lat').value = lat;
      document.getElementById('add-lng').value = lng;
      document.getElementById('add-status').textContent = '✓ 坐标已自动填入：' + lat + ', ' + lng;
      document.getElementById('add-status').style.color='#5a9060';
    } else {
      document.getElementById('add-status').textContent = '未找到，请手动填写坐标';
      document.getElementById('add-status').style.color='#a06050';
    }
  } catch(e) {
    document.getElementById('add-status').textContent = '网络错误，请手动填写坐标';
    document.getElementById('add-status').style.color='#a06050';
  }
});

// Confirm add
document.getElementById('add-confirm').addEventListener('click', ()=>{
  const name = document.getElementById('add-name').value.trim();
  const country = document.getElementById('add-country').value.trim();
  const desc = document.getElementById('add-desc').value.trim() || '等待探索的城市';
  const lat = parseFloat(document.getElementById('add-lat').value);
  const lng = parseFloat(document.getElementById('add-lng').value);
  if(!name || !country){ alert('请填写城市名和国家'); return; }
  if(isNaN(lat) || isNaN(lng)){ alert('请先查询坐标，或手动填写坐标'); return; }
  const newCity = {
    id: 'user_' + Date.now(),
    name, country, desc,
    coords: [lat, lng],
    isUserAdded: true
  };
  userCities.push(newCity);
  saveUserCities();
  addDotToGlobe(newCity);
  updateStats();
  document.getElementById('add-modal').classList.remove('show');
  // Async: look up ISO and repaint country
  getIsoByCountryName(country).then(iso=>{
    if(iso){ VISITED.add(iso); }
    fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')
      .then(r=>r.json()).then(w=>drawCountriesOnCanvas(w)).catch(()=>{});
  });
});

// Cancel
document.getElementById('add-cancel-btn').addEventListener('click', ()=>{
  document.getElementById('add-modal').classList.remove('show');
});
document.getElementById('add-modal-bg').addEventListener('click', ()=>{
  document.getElementById('add-modal').classList.remove('show');
});
</script>
